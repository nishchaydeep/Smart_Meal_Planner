<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe & Meal Planner 🍽️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🍽️ Recipe & Meal Planner</h1>
            <p class="tagline">AI-Powered Nutrition Assistant</p>
        </header>

        <!-- Profile Section -->
        <section class="card" id="profile-section">
            <h2>👤 Your Profile</h2>
            <div id="profile-display" class="hidden">
                <div class="profile-stats">
                    <div class="stat-card">
                        <div class="stat-label">BMI</div>
                        <div class="stat-value" id="display-bmi">-</div>
                        <div class="stat-category" id="display-bmi-category">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Daily Calories</div>
                        <div class="stat-value" id="display-calories">-</div>
                        <div class="stat-category">kcal</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Activity</div>
                        <div class="stat-value" id="display-activity">-</div>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="showProfileForm()">Edit Profile</button>
            </div>

            <form id="profile-form" class="hidden">
                <div class="form-row">
                    <div class="form-group">
                        <label>Height (cm)</label>
                        <input type="number" id="height" placeholder="175" required>
                    </div>
                    <div class="form-group">
                        <label>Weight (kg)</label>
                        <input type="number" id="weight" placeholder="70" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="age" placeholder="28" required>
                    </div>
                    <div class="form-group">
                        <label>Sex</label>
                        <select id="sex" required>
                            <option value="">Select...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Activity Level</label>
                    <select id="activityLevel">
                        <option value="sedentary">Sedentary (little to no exercise)</option>
                        <option value="light">Light (1-3 days/week)</option>
                        <option value="moderate" selected>Moderate (3-5 days/week)</option>
                        <option value="active">Active (6-7 days/week)</option>
                        <option value="very_active">Very Active (athlete)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Dietary Preferences (comma-separated)</label>
                    <input type="text" id="dietaryPreferences" placeholder="e.g., vegetarian, low-carb">
                </div>

                <div class="form-group">
                    <label>Allergies (comma-separated)</label>
                    <input type="text" id="allergies" placeholder="e.g., peanuts, shellfish">
                </div>

                <button type="submit" class="btn btn-primary">Save Profile</button>
            </form>
        </section>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('ingredients')">🔍 Ingredients</button>
            <button class="tab-btn" onclick="showTab('recipes')">🍳 Recipes</button>
            <button class="tab-btn" onclick="showTab('meals')">📝 Meal History</button>
        </div>

        <!-- Ingredients Tab -->
        <section class="card tab-content" id="tab-ingredients">
            <h2>Search Ingredients</h2>
            
            <div class="search-box">
                <input type="text" id="ingredient-search" placeholder="e.g., quinoa, chicken breast, avocado">
                <button class="btn btn-primary" onclick="searchIngredient()">Search Info</button>
                <button class="btn btn-secondary" onclick="getCalories()">Get Calories</button>
            </div>

            <div class="form-group" id="amount-group" style="margin-top: 15px; display: none;">
                <label>Amount (optional)</label>
                <input type="text" id="amount" placeholder="e.g., 200g, 1 cup">
            </div>

            <div id="ingredient-result" class="result-box hidden"></div>
        </section>

        <!-- Recipes Tab -->
        <section class="card tab-content hidden" id="tab-recipes">
            <h2>Recipe Suggestions</h2>
            <p class="info-text">Get personalized recipe suggestions based on your profile and eating habits</p>
            
            <button class="btn btn-primary btn-large" onclick="suggestRecipes()">
                ✨ Get Recipe Suggestions
            </button>

            <div id="recipes-result" class="result-box hidden"></div>

            <!-- Log Meal Form -->
            <div id="log-meal-section" class="hidden" style="margin-top: 30px;">
                <h3>Log a Meal</h3>
                <form id="meal-form">
                    <div class="form-group">
                        <label>Recipe Name</label>
                        <input type="text" id="meal-recipe" placeholder="e.g., Grilled Chicken Salad" required>
                    </div>
                    <div class="form-group">
                        <label>Ingredients (comma-separated)</label>
                        <input type="text" id="meal-ingredients" placeholder="e.g., chicken, lettuce, tomatoes" required>
                    </div>
                    <div class="form-group">
                        <label>Total Calories (optional)</label>
                        <input type="number" id="meal-calories" placeholder="e.g., 450">
                    </div>
                    <button type="submit" class="btn btn-primary">Log Meal</button>
                </form>
            </div>
        </section>

        <!-- Meals Tab -->
        <section class="card tab-content hidden" id="tab-meals">
            <h2>Meal History</h2>
            <button class="btn btn-secondary" onclick="loadMealHistory()">Refresh</button>
            <div id="meals-result" class="result-box"></div>
        </section>

        <!-- Loading Spinner -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
